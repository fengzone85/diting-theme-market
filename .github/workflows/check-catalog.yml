name: Check catalog

# 校验 v1.json：schema/字段契约/short 排序与去重/SHA-256 格式/download+sha256 成对。
# 规则与 diting server parseCatalog 对齐（server 会静默跳过非法条目，必须在此拦截）。
# 不设 paths 过滤：任何改动都应产出校验结果。
# 注意：机器人（GITHUB_TOKEN）创建的 PR 会触发 action_required 而不执行，故本检查
# 不设为分支保护的必需项；收录/更新脚本在写盘前会本地跑同一套校验作为兜底。
on:
  push:
    branches: [main]
  pull_request:
  # 供收录/更新工作流主动调度：GITHUB_TOKEN 创建的 PR 不会触发 pull_request 事件，
  # 必须由上游工作流显式 dispatch 才能让 PR 拿到必需的 check 结果。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-catalog.mjs
