name: Submit theme from issue

# 收录流程：Issue Form 提交 → Action 下载主题包并校验
# （根 manifest、short、version、SHA-256）→ 写入 v1.json → 创建 PR。
# 校验失败会回评到原 Issue 并附原因。
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  add:
    runs-on: ubuntu-latest
    # 仅处理 Issue Form（正文含表单段落标记），普通 Issue 直接跳过
    if: contains(github.event.issue.body, '### ')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preflight (runner dependencies)
        run: |
          node -v
          unzip -v > /dev/null
          gh --version
      - name: Parse issue and create PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PAYLOAD: ${{ toJSON(github.event) }}
        run: node scripts/add-theme-from-issue.mjs
      - name: Dispatch catalog check for PR branch
        # GITHUB_TOKEN 创建的 PR 不会触发 pull_request 工作流，这里显式补一次
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)
          # 仅当分支确实推送到远端（存在对应 PR）时才补检查；无变更时会提前返回、分支未推送
          if [ "$branch" != "main" ] && [ "$branch" != "HEAD" ] && \
             git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            gh workflow run check-catalog.yml --ref "$branch"
          fi
